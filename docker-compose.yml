services:
  postgres:
    image: postgres:16-alpine
    container_name: stratos-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: stratos
    volumes:
      - stratos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stratos"]
      interval: 3s
      timeout: 5s
      retries: 15
      start_period: 5s

volumes:
  stratos_pgdata:
